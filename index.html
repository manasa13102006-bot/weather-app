<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="weather-card">

            <h1>Weather App</h1>

            <!-- Search section -->
            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

            <!-- Loading message -->
            <p id="loading" class="hidden">
                Loading weather...
            </p>

            <!-- Error message -->
            <p id="error" class="error hidden"></p>

            <!-- Weather information -->
            <div id="weatherContainer" class="hidden">

                <div class="location">
                    <h2 id="cityName">Bengaluru</h2>
                    <p id="countryName">India</p>
                </div>

                <div class="weather-main">

                    <div id="weatherIcon" class="weather-icon">
                        ☀️
                    </div>

                    <div>
                        <div class="temperature">
                            <span id="temperature">--</span>°C
                        </div>

                        <p id="weatherDescription">
                            Clear sky
                        </p>
                    </div>

                </div>

                <div class="weather-details">

                    <div class="detail">
                        <span>🌡️</span>
                        <div>
                            <p>Feels Like</p>
                            <strong>
                                <span id="feelsLike">--</span>°C
                            </strong>
                        </div>
                    </div>

                    <div class="detail">
                        <span>💧</span>
                        <div>
                            <p>Humidity</p>
                            <strong>
                                <span id="humidity">--</span>%
                            </strong>
                        </div>
                    </div>

                    <div class="detail">
                        <span>💨</span>
                        <div>
                            <p>Wind Speed</p>
                            <strong>
                                <span id="windSpeed">--</span> km/h
                            </strong>
                        </div>
                    </div>

                    <div class="detail">
                        <span>🌅</span>
                        <div>
                            <p>Day / Night</p>
                            <strong id="dayNight">
                                --
                            </strong>
                        </div>
                    </div>

                </div>

                <p class="updated">
                    Updated: <span id="updatedTime">--</span>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
